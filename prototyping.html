<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>True Sora Glyph Animation</title>

<style>
@font-face {
  font-family: 'Sora Local';
  /* Fixed the .woff22 typo and confirmed path */
  src: url('code/Sora/static/subset.woff2') format('woff2');
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}

:root {
  --navy: #1a3a5c;
  --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: white;
  font-family: 'Sora Local', sans-serif;
}

.container {
  display: flex;
  align-items: baseline;
  font-size: 1.9rem;
  color: var(--navy);
}

svg {
  height: 1.9rem; /* Matches font size */
  overflow: visible;
  /* Shift SVGs down slightly to align with text baseline */
  transform: translateY(0.15em);
}

.name-part {
  overflow: hidden;
  max-width: 0;
  opacity: 0;
  white-space: nowrap;
  display: inline-block;
  transition: max-width 0.9s var(--ease), opacity 0.6s var(--ease);
}

.expand .name-part {
  max-width: 400px;
  opacity: 1;
}
</style>
</head>

<body>

<div class="container" id="name">

<svg viewBox="0 0 700 1000">
<defs>
  <mask id="maskJ">
    <rect x="-100" y="-1000" width="1000" height="1500" fill="black"/>
    <path id="j-reveal"
      d="M500 -100 V600 Q500 900 200 900"
      stroke="white" stroke-width="400" stroke-linecap="round" fill="none"
      stroke-dasharray="2000" stroke-dashoffset="2000"/>
  </mask>
</defs>
<g transform="scale(1, -1) translate(0, -730)">
  <path d="M300 -19Q221 -19 161.0 12.0Q101 43 68.0 103.0Q35 163 35 250V282H176V238Q176 180 210.0 146.5Q244 113 299 113Q355 113 388.5 146.5Q422 180 422 238V625H564V250Q564 163 531.0 103.0Q498 43 439.0 12.0Q380 -19 300 -19ZM124 605V730H564V605Z"
  fill="var(--navy)" mask="url(#maskJ)"/>
</g>
</svg>

<span class="name-part">ames</span>

<svg viewBox="0 0 750 1000">
<defs>
  <mask id="maskB">
    <rect x="-100" y="-1000" width="1000" height="1500" fill="black"/>
    <rect id="b-backbone" x="0" y="-800" width="250" height="0" fill="white"/>
    <rect id="b-top" x="0" y="-800" width="0" height="450" fill="white"/>
    <rect id="b-bottom" x="0" y="-350" width="0" height="500" fill="white"/>
  </mask>
</defs>
<g transform="scale(1, -1) translate(0, -730)">
  <path d="M209 -5V109H392Q442 109 468.0 136.5Q494 164 494 212Q494 260 468.0 286.5Q442 313 392 313H209V400H382Q455 400 512.5 382.5Q570 365 602.5 324.0Q635 283 635 214V200Q635 135 606.5 89.5Q578 44 521.5 19.5Q465 -5 382 -5ZM90 -5V735H229V-5ZM209 336V423H365Q416 423 440.0 450.0Q464 477 464 522Q464 567 440.0 594.0Q416 621 365 621H209V735H352Q476 735 540.5 683.0Q605 631 605 534V520Q605 452 572.5 411.5Q540 371 483.0 353.5Q426 336 352 336Z"
  fill="var(--navy)" mask="url(#maskB)"/>
</g>
</svg>

<span class="name-part">yngaarden</span>

<svg viewBox="0 0 1100 1000">
<defs>
  <mask id="maskW">
    <rect x="-100" y="-1000" width="1300" height="1500" fill="black"/>
    <path id="w-left" d="M0 -800 L450 0 L600 -400" stroke="white" stroke-width="400" fill="none" stroke-dasharray="2000" stroke-dashoffset="2000"/>
    <path id="w-right" d="M1100 -800 L650 0 L600 -400" stroke="white" stroke-width="400" fill="none" stroke-dasharray="2000" stroke-dashoffset="2000"/>
  </mask>
</defs>
<g transform="scale(1, -1) translate(0, -730)">
  <path d="M210 0 24 730H171L322 95L283 118H383L339 95L458 702H580L432 0ZM646 0 485 702H612L749 95L706 118H804L766 95L899 730H1038L872 0Z"
  fill="var(--navy)" mask="url(#maskW)"/>
</g>
</svg>

<svg viewBox="0 0 400 1000">
<defs>
  <mask id="maskIII">
    <rect x="-100" y="-1000" width="1000" height="1500" fill="black"/>
    <rect class="i-bar" x="0" y="0" width="100" height="0" fill="white"/>
    <rect class="i-bar" x="140" y="0" width="100" height="0" fill="white"/>
    <rect class="i-bar" x="280" y="0" width="100" height="0" fill="white"/>
  </mask>
</defs>
<g transform="scale(1, -1) translate(0, -730)">
  <path d="M92 0V730H234V0Z M232 0V730H374V0Z M372 0V730H514V0Z" 
  fill="var(--navy)" mask="url(#maskIII)" transform="translate(-90,0)"/>
</g>
</svg>

</div>

<script>
const ease = 'cubic-bezier(0.25, 0.1, 0.25, 1)';

function animate() {
  // J
  document.getElementById('j-reveal').animate(
    [{ strokeDashoffset: 2000 }, { strokeDashoffset: 0 }],
    { duration: 900, easing: ease, fill: 'forwards' }
  );

  // B
  document.getElementById('b-backbone').animate(
    [{ height: 0, y: 0 }, { height: 1000, y: -800 }],
    { duration: 600, delay: 200, easing: ease, fill: 'forwards' }
  );
  document.getElementById('b-top').animate(
    [{ width: 0 }, { width: 1000 }],
    { duration: 500, delay: 700, easing: ease, fill: 'forwards' }
  );
  document.getElementById('b-bottom').animate(
    [{ width: 0 }, { width: 1000 }],
    { duration: 500, delay: 1000, easing: ease, fill: 'forwards' }
  );

  // W
  document.getElementById('w-left').animate(
    [{ strokeDashoffset: 2000 }, { strokeDashoffset: 0 }],
    { duration: 1000, delay: 300, easing: ease, fill: 'forwards' }
  );
  document.getElementById('w-right').animate(
    [{ strokeDashoffset: 2000 }, { strokeDashoffset: 0 }],
    { duration: 1000, delay: 300, easing: ease, fill: 'forwards' }
  );

  // III
  document.querySelectorAll('.i-bar').forEach((el, i) => {
    el.animate(
      [{ height: 0, y: 0 }, { height: 1000, y: -800 }],
      { duration: 800, delay: 600 + (i * 100), easing: ease, fill: 'forwards' }
    );
  });

  // Phase 2: Expand
  setTimeout(() => {
    document.getElementById('name').classList.add('expand');
  }, 1800);
}

// Start
window.onload = animate;
</script>

</body>
</html>
