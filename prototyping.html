<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>True Glyph Animation</title>

<style>
    
@font-face {
  font-family: 'Sora Local';
  /* This path assumes index.html and the 'static' folder are together */
  src: url('code/Sora/static/subset.woff22') format('woff2');
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}

:root {
  --navy: #1a3a5c;
  --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: white;
  /* Now 'Sora Local' will actually trigger */
  font-family: 'Sora Local', sans-serif;
}

.container {
  display: flex;
  align-items: baseline;
  font-size: 1.9rem;
  color: var(--navy);
}

svg {
  height: 1.9rem;
  overflow: visible;
}

.name-part {
  overflow: hidden;
  max-width: 0;
  opacity: 0;
  white-space: nowrap;
  display: inline-block;
  transition:
    max-width 0.9s var(--ease),
    opacity 0.6s var(--ease);
}

.expand .name-part {
  max-width: 220px;
  opacity: 1;
}
</style>
</head>

<body>

<div class="container" id="name">

<!-- J -->
<svg viewBox="0 0 120 120">
<defs>
  <mask id="maskJ">
    <rect width="100%" height="100%" fill="black"/>

    <!-- reveal sweep -->
    <path id="j-reveal"
      d="M90 0 L90 100 Q90 120 50 120"
      stroke="white"
      stroke-width="60"
      stroke-linecap="round"
      fill="none"
      stroke-dasharray="400"
      stroke-dashoffset="400"/>
  </mask>
</defs>

<!-- REAL PATH -->
<path d="M95 5 H20 V25 H70 V85 Q70 105 50 105 Q35 105 30 95 L15 105 Q25 120 50 120 Q90 120 90 85 V5 Z"
fill="var(--navy)" mask="url(#maskJ)"/>
</svg>

<span class="name-part">ames</span>

<!-- B -->
<svg viewBox="0 0 120 120">
<defs>
  <mask id="maskB">
    <rect width="100%" height="100%" fill="black"/>

    <rect id="b-backbone" x="0" y="0" width="40" height="0" fill="white"/>

    <rect id="b-top" x="0" y="0" width="0" height="60" fill="white"/>
    <rect id="b-bottom" x="0" y="60" width="0" height="60" fill="white"/>
  </mask>
</defs>

<path d="M10 5 H65 Q95 5 95 30 Q95 50 70 55 Q100 60 100 90 Q100 115 65 115 H10 Z"
fill="var(--navy)" mask="url(#maskB)"/>
</svg>

<span class="name-part">yngaarden</span>

<!-- W -->
<svg viewBox="0 0 160 120">
<defs>
  <mask id="maskW">
    <rect width="100%" height="100%" fill="black"/>

    <path id="w-left"
      d="M0 0 L60 120 L80 60"
      stroke="white"
      stroke-width="60"
      fill="none"
      stroke-linecap="round"
      stroke-dasharray="400"
      stroke-dashoffset="400"/>

    <path id="w-right"
      d="M160 0 L100 120 L80 60"
      stroke="white"
      stroke-width="60"
      fill="none"
      stroke-linecap="round"
      stroke-dasharray="400"
      stroke-dashoffset="400"/>
  </mask>
</defs>

<path d="M10 5 L40 115 L80 45 L120 115 L150 5 H120 L100 85 L80 35 L60 85 L40 5 Z"
fill="var(--navy)" mask="url(#maskW)"/>
</svg>

<!-- III -->
<svg viewBox="0 0 120 120">
<defs>
  <mask id="maskIII">
    <rect width="100%" height="100%" fill="black"/>

    <rect class="i-bar" x="10" y="120" width="25" height="0" fill="white"/>
    <rect class="i-bar" x="50" y="120" width="25" height="0" fill="white"/>
    <rect class="i-bar" x="90" y="120" width="25" height="0" fill="white"/>
  </mask>
</defs>

<path d="M10 5 H35 V115 H10 Z M50 5 H75 V115 H50 Z M90 5 H115 V115 H90 Z"
fill="var(--navy)" mask="url(#maskIII)"/>
</svg>

</div>

<script>
const ease = 'cubic-bezier(0.25, 0.1, 0.25, 1)';

function animate() {

  // J
  document.getElementById('j-reveal').animate(
    [{ strokeDashoffset: 400 }, { strokeDashoffset: 0 }],
    { duration: 900, easing: ease, fill: 'forwards' }
  );

  // B
  document.getElementById('b-backbone').animate(
    [{ height: 0 }, { height: 120 }],
    { duration: 500, delay: 200, easing: ease, fill: 'forwards' }
  );

  document.getElementById('b-top').animate(
    [{ width: 0 }, { width: 120 }],
    { duration: 400, delay: 700, easing: ease, fill: 'forwards' }
  );

  document.getElementById('b-bottom').animate(
    [{ width: 0 }, { width: 120 }],
    { duration: 400, delay: 1000, easing: ease, fill: 'forwards' }
  );

  // W
  document.getElementById('w-left').animate(
    [{ strokeDashoffset: 400 }, { strokeDashoffset: 0 }],
    { duration: 900, delay: 300, easing: ease, fill: 'forwards' }
  );

  document.getElementById('w-right').animate(
    [{ strokeDashoffset: 400 }, { strokeDashoffset: 0 }],
    { duration: 900, delay: 300, easing: ease, fill: 'forwards' }
  );

  // III
  document.querySelectorAll('.i-bar').forEach(el => {
    el.animate(
      [{ y: 120, height: 0 }, { y: 5, height: 110 }],
      { duration: 700, delay: 500, easing: ease, fill: 'forwards' }
    );
  });

  // Phase 2
  setTimeout(() => {
    document.getElementById('name').classList.add('expand');
  }, 1500);
}

animate();
</script>

</body>
</html>
