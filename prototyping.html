<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Animation Prototype</title>
    <style>
        /* Import the exact font from your site */
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600&display=swap');

        :root {
            --color-navy: #1a3a5c;
            --font-display: 'Sora', sans-serif;
            --expand-duration: 0.8s;
            --expand-easing: cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        body {
            background-color: #f7f8f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Container to mimic your header layout */
        .preview-box {
            background: white;
            padding: 60px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
        }

        .name-animated {
            display: flex;
            align-items: baseline;
            white-space: nowrap;
            font-family: var(--font-display);
            font-size: 2.5rem; /* Scaled up for prototyping visibility */
            font-weight: 600;
            color: var(--color-navy);
            letter-spacing: -0.02em;
        }

        /* SVG Initial Styling */
        .initial-svg {
            height: 0.9em;
            width: auto;
            overflow: visible;
            margin-right: 0.05em;
            /* Fine-tune the vertical alignment to match the text baseline */
            transform: translateY(0.12em); 
        }

        .draw-path {
            fill: none;
            stroke: var(--color-navy);
            stroke-width: 65; /* Matches Sora Bold weight at this scale */
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 2000;
            stroke-dashoffset: 2000;
            transition: stroke-dashoffset 1.3s ease-in-out;
        }

        /* Phase 1 Trigger */
        .show-initials .draw-path {
            stroke-dashoffset: 0;
        }

        /* Phase 2: Hidden letters expand horizontally */
        .name-animated .letter.hidden {
            display: inline-block;
            max-width: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-width var(--expand-duration) var(--expand-easing),
                        opacity 0.3s ease-out;
        }

        .name-animated.expanded .letter.hidden {
            max-width: 1em;
            opacity: 1;
        }

        /* Staggering the expansion */
        .name-animated.expanded .letter.hidden.g1 { transition-delay: 0.0s; }
        .name-animated.expanded .letter.hidden.g2 { transition-delay: 0.05s; }
        .name-animated.expanded .letter.hidden.g3 { transition-delay: 0.10s; }
        .name-animated.expanded .letter.hidden.g4 { transition-delay: 0.15s; }
        /* ... repeat for as many letters as needed */

        .name-animated .letter.space { width: 0.3em; max-width: 0; transition: max-width var(--expand-duration) var(--expand-easing); }
        .name-animated.expanded .letter.space { max-width: 0.3em; }
    </style>
</head>
<body>

    <div class="preview-box">
        <div class="name-animated" id="nameAnimated">
            
            <svg class="initial-svg" viewBox="0 0 400 550">
                <path class="draw-path" d="M 50 100 H 350 M 210 100 V 400 Q 210 500 80 500" />
            </svg>
            
            <span class="letter hidden g1">a</span>
            <span class="letter hidden g2">m</span>
            <span class="letter hidden g3">e</span>
            <span class="letter hidden g4">s</span>
            <span class="letter space hidden"></span>

            <svg class="initial-svg" viewBox="0 0 420 550">
                <path class="draw-path" d="M 100 500 V 100 C 380 100 380 300 100 300 C 400 300 400 500 100 500" />
            </svg>
            
            <span class="letter hidden">.</span>
            <span class="letter space hidden"></span>

            <svg class="initial-svg" viewBox="0 0 650 550">
                <path class="draw-path" d="M 50 100 L 180 500 L 325 250" />
                <path class="draw-path" d="M 600 100 L 470 500 L 325 250" />
            </svg>

            <span class="letter hidden g1">y</span>
            <span class="letter hidden g2">n</span>
            <span class="letter hidden g3">g</span>
            <span class="letter hidden g4">a</span>
            <span class="letter space hidden"></span>

            <svg class="initial-svg" viewBox="0 0 450 550">
                <path class="draw-path" d="M 100 500 V 100 M 225 500 V 100 M 350 500 V 100" />
            </svg>

        </div>
        
        <p style="margin-top: 20px; font-family: sans-serif; color: #888; font-size: 0.8rem;">
            Refresh page to re-run animation
        </p>
    </div>

    <script>
        (function() {
            const name = document.getElementById('nameAnimated');

            // 100ms: Start Phase 1 (Drawing Initials)
            setTimeout(() => {
                name.classList.add('show-initials');
            }, 100);

            // 1600ms: Start Phase 2 (Expanding Name)
            // We wait longer so the SVG drawing has time to complete
            setTimeout(() => {
                name.classList.add('expanded');
            }, 1600);
        })();
    </script>
</body>
</html>
