<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Accuracy Analyzer - James B. Wyngaarden III</title>
    <link rel="icon" type="image/png" href="stimuli/favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;1,8..60,400&family=Sora:wght@300;400;500;600;700&display=swap');

        :root {
            --color-text: #1e2d3d;
            --color-text-light: #5a6a78;
            --color-navy: #1a3a5c;
            --color-navy-light: #2a4f7a;
            --color-gold: #b8860b;
            --color-gold-muted: #c4973b;
            --color-bg: #ffffff;
            --color-bg-subtle: #f7f8f9;
            --color-border: #dfe3e7;
            --font-serif: 'Source Serif 4', 'Georgia', serif;
            --font-display: 'Sora', 'Helvetica Neue', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-display);
            line-height: 1.7;
            color: var(--color-text);
            background: var(--color-bg);
            min-height: 100vh;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        .page-header {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--color-text-light);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--color-navy);
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--color-navy);
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: var(--color-text-light);
            font-size: 1rem;
            font-family: var(--font-serif);
        }

        #chess-app {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .control-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
            color: var(--color-text-light);
        }

        .control-group input,
        .control-group select {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--color-border);
            font-size: 15px;
            font-family: var(--font-display);
            background: var(--color-bg-subtle);
        }

        .control-group input {
            width: 180px;
        }

        .analyze-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: var(--color-navy);
            color: white;
            font-size: 15px;
            font-weight: 600;
            font-family: var(--font-display);
            cursor: pointer;
            transition: background 0.2s;
        }

        .analyze-btn:hover {
            background: var(--color-navy-light);
        }

        .analyze-btn:disabled {
            background: var(--color-text-light);
            cursor: not-allowed;
        }

        .error-msg {
            padding: 12px 16px;
            background: #fef2f2;
            color: #dc2626;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            padding: 16px;
            background: var(--color-bg-subtle);
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            font-size: 13px;
            color: var(--color-text-light);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--color-text);
        }

        .stat-value.success { color: #22c55e; }
        .stat-value.accent { color: var(--color-navy); }

        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filters select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--color-border);
            font-size: 14px;
            font-family: var(--font-display);
            background: var(--color-bg-subtle);
        }

        .games-count {
            font-size: 14px;
            color: var(--color-text-light);
            margin-bottom: 12px;
        }

        .games-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .game-row {
            display: grid;
            grid-template-columns: 60px 70px 1fr 80px;
            gap: 12px;
            align-items: center;
            padding: 12px 16px;
            background: var(--color-bg-subtle);
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            transition: background 0.15s;
        }

        .game-row:hover {
            background: var(--color-border);
        }

        .game-accuracy {
            font-size: 18px;
            font-weight: 700;
        }

        .game-accuracy.excellent { color: #22c55e; }
        .game-accuracy.good { color: var(--color-navy); }
        .game-accuracy.average { color: #eab308; }
        .game-accuracy.poor { color: #ef4444; }

        .game-result {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .game-result.win { color: #22c55e; }
        .game-result.draw { color: #eab308; }
        .game-result.loss { color: #ef4444; }

        .game-result-icon {
            font-size: 16px;
        }

        .game-result-text {
            font-size: 13px;
            text-transform: capitalize;
        }

        .game-details {
            min-width: 0;
        }

        .game-opponent {
            font-size: 14px;
            font-weight: 500;
        }

        .game-meta {
            font-size: 12px;
            color: var(--color-text-light);
        }

        .game-rating {
            font-size: 14px;
            font-weight: 600;
            text-align: right;
        }

        .more-games {
            text-align: center;
            padding: 16px;
            color: var(--color-text-light);
            font-size: 14px;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .game-row {
                grid-template-columns: 50px 60px 1fr;
            }
            .game-rating {
                display: none;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .control-group input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="art.html" class="back-link">← Back to Art</a>
        <h1 class="page-title">♟️ Chess Accuracy Analyzer</h1>
        <p class="page-subtitle">Analyzing my Chess.com games by accuracy, not just wins and losses.</p>
    </header>

    <div id="chess-app">
        <div class="controls">
            <div class="control-group">
                <label for="username">Username</label>
                <input type="text" id="username" value="babyboyjw" placeholder="Chess.com username">
            </div>
            <div class="control-group">
                <label for="months">Months</label>
                <select id="months">
                    <option value="1">1 month</option>
                    <option value="3" selected>3 months</option>
                    <option value="6">6 months</option>
                    <option value="12">12 months</option>
                </select>
            </div>
            <button class="analyze-btn" id="analyze-btn">Analyze Games</button>
        </div>

        <div id="error" class="error-msg" style="display: none;"></div>

        <div id="stats" style="display: none;"></div>

        <div id="games-container" style="display: none;">
            <div class="filters">
                <select id="sort-by">
                    <option value="accuracy">Highest Accuracy</option>
                    <option value="accuracy_asc">Lowest Accuracy</option>
                    <option value="rating">Highest Rating</option>
                    <option value="rating_asc">Lowest Rating</option>
                    <option value="date">Most Recent</option>
                </select>
                <select id="filter-time">
                    <option value="all">All Time Controls</option>
                    <option value="rapid">Rapid</option>
                    <option value="blitz">Blitz</option>
                    <option value="bullet">Bullet</option>
                    <option value="daily">Daily</option>
                </select>
            </div>
            <div id="games-count" class="games-count"></div>
            <div id="games-list" class="games-list"></div>
            <div id="more-games" class="more-games" style="display: none;"></div>
        </div>
    </div>

    <script>
        (function() {
            let allGames = [];
            
            const elements = {
                username: document.getElementById('username'),
                months: document.getElementById('months'),
                analyzeBtn: document.getElementById('analyze-btn'),
                error: document.getElementById('error'),
                stats: document.getElementById('stats'),
                gamesContainer: document.getElementById('games-container'),
                sortBy: document.getElementById('sort-by'),
                filterTime: document.getElementById('filter-time'),
                gamesCount: document.getElementById('games-count'),
                gamesList: document.getElementById('games-list'),
                moreGames: document.getElementById('more-games')
            };

            elements.analyzeBtn.addEventListener('click', fetchGames);
            elements.sortBy.addEventListener('change', renderGames);
            elements.filterTime.addEventListener('change', renderGames);
            elements.username.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') fetchGames();
            });

            async function fetchGames() {
                const username = elements.username.value.trim();
                const monthsToFetch = parseInt(elements.months.value);

                if (!username) {
                    showError('Please enter a username');
                    return;
                }

                elements.analyzeBtn.disabled = true;
                elements.analyzeBtn.innerHTML = '<span class="loading-spinner"></span>Loading...';
                elements.error.style.display = 'none';
                elements.stats.style.display = 'none';
                elements.gamesContainer.style.display = 'none';
                allGames = [];

                try {
                    const archivesResp = await fetch(
                        `https://api.chess.com/pub/player/${username}/games/archives`,
                        { headers: { 'Accept': 'application/json' } }
                    );

                    if (!archivesResp.ok) {
                        throw new Error(`Player "${username}" not found`);
                    }

                    const archivesData = await archivesResp.json();
                    const archives = archivesData.archives.slice(-monthsToFetch);

                    let rawGames = [];
                    for (const archiveUrl of archives) {
                        const gamesResp = await fetch(archiveUrl);
                        if (gamesResp.ok) {
                            const gamesData = await gamesResp.json();
                            rawGames = rawGames.concat(gamesData.games || []);
                        }
                    }

                    allGames = rawGames
                        .filter(game => game.accuracies)
                        .map(game => {
                            const isWhite = game.white.username.toLowerCase() === username.toLowerCase();
                            const playerData = isWhite ? game.white : game.black;
                            const opponentData = isWhite ? game.black : game.white;
                            const accuracy = isWhite ? game.accuracies.white : game.accuracies.black;

                            return {
                                accuracy,
                                result: playerData.result,
                                color: isWhite ? 'white' : 'black',
                                yourRating: playerData.rating,
                                opponent: opponentData.username,
                                opponentRating: opponentData.rating,
                                timeClass: game.time_class,
                                url: game.url,
                                date: new Date(game.end_time * 1000)
                            };
                        });

                    if (allGames.length === 0) {
                        throw new Error('No analyzed games found. Games need accuracy data from Chess.com analysis.');
                    }

                    renderStats();
                    renderGames();

                } catch (err) {
                    showError(err.message);
                } finally {
                    elements.analyzeBtn.disabled = false;
                    elements.analyzeBtn.textContent = 'Analyze Games';
                }
            }

            function showError(message) {
                elements.error.textContent = message;
                elements.error.style.display = 'block';
            }

            function renderStats() {
                const accuracies = allGames.map(g => g.accuracy);
                const wins = allGames.filter(g => g.result === 'win');
                const losses = allGames.filter(g => !['win', 'draw', 'stalemate'].includes(g.result));

                const stats = {
                    total: allGames.length,
                    avgAccuracy: (accuracies.reduce((a, b) => a + b, 0) / accuracies.length).toFixed(1),
                    highest: Math.max(...accuracies).toFixed(1),
                    lowest: Math.min(...accuracies).toFixed(1),
                    avgWinAccuracy: wins.length ? (wins.reduce((a, g) => a + g.accuracy, 0) / wins.length).toFixed(1) : '-',
                    avgLossAccuracy: losses.length ? (losses.reduce((a, g) => a + g.accuracy, 0) / losses.length).toFixed(1) : '-',
                    highestRating: Math.max(...allGames.map(g => g.yourRating))
                };

                elements.stats.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">Games Analyzed</div>
                            <div class="stat-value">${stats.total}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Avg Accuracy</div>
                            <div class="stat-value">${stats.avgAccuracy}%</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Highest</div>
                            <div class="stat-value success">${stats.highest}%</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Lowest</div>
                            <div class="stat-value">${stats.lowest}%</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Avg in Wins</div>
                            <div class="stat-value">${stats.avgWinAccuracy}%</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Avg in Losses</div>
                            <div class="stat-value">${stats.avgLossAccuracy}%</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Peak Rating</div>
                            <div class="stat-value accent">${stats.highestRating}</div>
                        </div>
                    </div>
                `;
                elements.stats.style.display = 'block';
            }

            function renderGames() {
                const sortBy = elements.sortBy.value;
                const filterTime = elements.filterTime.value;

                let filtered = allGames.filter(g => 
                    filterTime === 'all' || g.timeClass === filterTime
                );

                filtered.sort((a, b) => {
                    switch (sortBy) {
                        case 'accuracy': return b.accuracy - a.accuracy;
                        case 'accuracy_asc': return a.accuracy - b.accuracy;
                        case 'rating': return b.yourRating - a.yourRating;
                        case 'rating_asc': return a.yourRating - b.yourRating;
                        case 'date': return b.date - a.date;
                        default: return 0;
                    }
                });

                elements.gamesCount.textContent = `Showing ${Math.min(filtered.length, 50)} of ${filtered.length} games`;

                const gamesHtml = filtered.slice(0, 50).map(game => {
                    const accClass = game.accuracy >= 90 ? 'excellent' : 
                                     game.accuracy >= 80 ? 'good' : 
                                     game.accuracy >= 70 ? 'average' : 'poor';
                    
                    const resultClass = game.result === 'win' ? 'win' : 
                                        (game.result === 'draw' || game.result === 'stalemate') ? 'draw' : 'loss';
                    
                    const resultIcon = game.result === 'win' ? '✓' : 
                                       (game.result === 'draw' || game.result === 'stalemate') ? '½' : '✗';
                    
                    const resultText = game.result === 'win' ? 'Win' : 
                                       (game.result === 'draw' || game.result === 'stalemate') ? 'Draw' : 'Loss';

                    return `
                        <a href="${game.url}" target="_blank" rel="noopener noreferrer" class="game-row">
                            <div class="game-accuracy ${accClass}">${game.accuracy.toFixed(1)}%</div>
                            <div class="game-result ${resultClass}">
                                <span class="game-result-icon">${resultIcon}</span>
                                <span class="game-result-text">${resultText}</span>
                            </div>
                            <div class="game-details">
                                <div class="game-opponent">vs ${game.opponent} (${game.opponentRating})</div>
                                <div class="game-meta">${game.color} • ${game.timeClass} • ${game.date.toLocaleDateString()}</div>
                            </div>
                            <div class="game-rating">${game.yourRating}</div>
                        </a>
                    `;
                }).join('');

                elements.gamesList.innerHTML = gamesHtml;

                if (filtered.length > 50) {
                    elements.moreGames.textContent = `Showing top 50 of ${filtered.length} games`;
                    elements.moreGames.style.display = 'block';
                } else {
                    elements.moreGames.style.display = 'none';
                }

                elements.gamesContainer.style.display = 'block';
            }
        })();
    </script>
</body>
</html>
